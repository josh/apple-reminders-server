type Query {
  """
  Accounts available in Reminders.
  """
  accounts: [Account!]

  """
  Find an account by its unique identifier; null when missing.
  """
  account(id: ID!): Account

  """
  Lists available in Reminders.
  """
  lists(
    limit: Int! = 50
    offset: Int! = 0
    filter: ListFilter
    orderBy: ListOrder
  ): ListPage

  """
  Find a list by its unique identifier; null when missing.
  """
  list(id: ID!): ReminderList

  """
  Reminders available in the application, including completed items.
  """
  reminders(
    limit: Int! = 50
    offset: Int! = 0
    orderBy: ReminderOrder
    filter: ReminderFilter
  ): ReminderPage

  """
  Find a reminder by its unique identifier; null when missing.
  """
  reminder(id: ID!): Reminder

  """
  The default account in Reminders, or null if none is available.
  """
  defaultAccount: Account

  """
  The default reminder list, or null if none is available.
  """
  defaultList: ReminderList
}

type Account {
  """
  Unique identifier of the account. Treat this value as opaque.
  """
  id: ID!

  """
  The name of the account.
  """
  name: String

  """
  Lists in this account; filters apply within it.
  """
  lists(
    limit: Int! = 50
    offset: Int! = 0
    filter: ListFilter
    orderBy: ListOrder
  ): ListPage

  """
  Reminders in this account, including completed items; filters apply within it.
  """
  reminders(
    limit: Int! = 50
    offset: Int! = 0
    orderBy: ReminderOrder
    filter: ReminderFilter
  ): ReminderPage
}

input ListFilter {
  """
  Case-insensitive substring of the list name.
  """
  query: String

  """
  Match lists in any of these accounts, intersected with the parent scope; [] matches nothing.
  """
  accountIds: [ID!]

  """
  Match whether reminders in the list can be modified.
  """
  allowsContentModifications: Boolean

  """
  Match subscribed or unsubscribed lists.
  """
  subscribed: Boolean
}

input ListOrder {
  """
  Direction of name ordering. Ties use identifier order; without orderBy, lists use identifier order.
  """
  direction: SortDirection = ASC
}

enum SortDirection {
  """
  Smallest or earliest first.
  """
  ASC

  """
  Largest or latest first.
  """
  DESC
}

type ListPage {
  """
  Lists in this page.
  """
  items: [ReminderList!]!

  """
  Number of matching lists before pagination.
  """
  totalCount: Int!

  """
  Position and availability of neighboring pages.
  """
  pageInfo: PageInfo!
}

type ReminderList {
  """
  Unique identifier of the list. Treat this value as opaque.
  """
  id: ID!

  """
  The name of the list.
  """
  name: String

  """
  Whether reminders can be added, edited, and deleted in this list.
  """
  allowsContentModifications: Boolean

  """
  Whether the list's own properties can be edited and the list deleted: it must allow content changes and be neither immutable nor subscribed.
  """
  allowsListModifications: Boolean

  """
  Whether the list is a subscription.
  """
  subscribed: Boolean

  """
  The color of the list as an sRGB #RRGGBBAA hex string.
  """
  color: String

  """
  The emblem icon name displayed beside the list. Read through Reminders automation, which may need Automation permission.
  """
  emblem: String

  """
  The account or parent list containing this list. Read through Reminders automation, which may need Automation permission.
  """
  container: ListContainer

  """
  The account that owns the list.
  """
  account: Account

  """
  Reminders in this list, including completed items; filters apply within it.
  """
  reminders(
    limit: Int! = 50
    offset: Int! = 0
    orderBy: ReminderOrder
    filter: ReminderFilter
  ): ReminderPage

  """
  Reminder counts for the whole list, regardless of pagination.
  """
  summary: ListSummary
}

union ListContainer = Account | ReminderList

input ReminderOrder {
  """
  Property to sort by.
  """
  field: ReminderSortField!

  """
  Direction of ordering. Nulls sort last either way and ties use identifier order; without orderBy, reminders use identifier order.
  """
  direction: SortDirection = ASC
}

enum ReminderSortField {
  """
  Reminder name.
  """
  NAME

  """
  Timed or all-day deadline.
  """
  DUE_DATE

  """
  Numeric priority.
  """
  PRIORITY

  """
  Creation timestamp.
  """
  CREATION_DATE

  """
  Last modification timestamp.
  """
  MODIFICATION_DATE

  """
  Completion timestamp.
  """
  COMPLETION_DATE
}

input ReminderFilter {
  """
  Match text in the reminder name or notes.
  """
  query: String

  """
  Match reminders belonging to these accounts; [] matches nothing.
  """
  accountIds: [ID!]

  """
  Match flagged or unflagged reminders. Uses Reminders automation; a failed read fails the collection.
  """
  flagged: Boolean

  """
  Match reminders with or without a timed or all-day deadline.
  """
  hasDueDate: Boolean

  """
  Inclusive lower bound on the deadline.
  """
  dueFrom: DateTime

  """
  Match reminders belonging to these lists; [] matches nothing.
  """
  listIds: [ID!]

  """
  Match any of these exact numeric priorities; [] matches nothing.
  """
  priorities: [Int!]

  """
  Match a deadline status, independent of completion.
  """
  dueStatus: DueStatus

  """
  Inclusive lower deadline bound as YYYY-MM-DD, using the host zone for timed deadlines. Do not mix timestamp and calendar-day bounds.
  """
  dueOnOrAfter: String

  """
  Exclusive upper deadline bound: timestamp or YYYY-MM-DD. Do not mix timestamp and calendar-day bounds.
  """
  dueBefore: String

  """
  Match completed or incomplete reminders; omission includes both.
  """
  completed: Boolean

  """
  Case-insensitive substring of the reminder name.
  """
  nameContains: String
}

"""
RFC 3339 timestamp with an explicit offset, serialized in UTC.
"""
scalar DateTime

enum DueStatus {
  """
  A timed deadline has passed, or an all-day deadline is before today.
  """
  OVERDUE

  """
  The deadline falls today and has not passed.
  """
  TODAY

  """
  The deadline falls after today.
  """
  FUTURE

  """
  No due date.
  """
  UNSCHEDULED

  """
  The due date cannot be classified.
  """
  UNKNOWN
}

type ReminderPage {
  """
  Reminders in this page.
  """
  items: [Reminder!]!

  """
  Number of matching reminders before pagination.
  """
  totalCount: Int!

  """
  Position and availability of neighboring pages.
  """
  pageInfo: PageInfo!
}

type Reminder {
  """
  Unique identifier of the reminder. Treat this value as opaque.
  """
  id: ID!

  """
  The name of the reminder.
  """
  name: String

  """
  The notes attached to the reminder.
  """
  body: String

  """
  Whether the reminder is marked completed.
  """
  completed: Boolean

  """
  The priority of the reminder: 0 none, 1–4 high, 5 medium, or 6–9 low.
  """
  priority: Int

  """
  The date and time the reminder was created.
  """
  creationDate: DateTime

  """
  The date and time the reminder was completed.
  """
  completionDate: DateTime

  """
  The date and time the reminder was last modified.
  """
  modificationDate: DateTime

  """
  Descriptive location text, separate from location-triggered alarms.
  """
  location: String

  """
  The deadline's calendar day: timed deadlines in the host zone, all-day deadlines as stored. Null when undated or unclassifiable.
  """
  dueDay: String

  """
  Identifier of the owning list.
  """
  listId: ID

  """
  An associated absolute URL; does not promise a rich-link preview in Reminders.
  """
  url: URL

  """
  The stored start date components.
  """
  startDateComponents: DateComponents

  """
  The stored due date components.
  """
  dueDateComponents: DateComponents

  """
  Deadline status, independent of completion.
  """
  dueStatus: DueStatus!

  """
  Alarms exactly as stored, including triggers the alarms union cannot represent.
  """
  rawAlarms: [RawAlarm!]!

  """
  Configured alerts. An empty list means no alerts; null indicates a read failure or a trigger this union cannot represent, and rawAlarms holds the stored values.
  """
  alarms: [ReminderAlarm!]

  """
  Recurrence rules exactly as stored; empty when none.
  """
  recurrenceRules: [RecurrenceRule!]!

  """
  A single repeating schedule; null when no recurrence is configured. Multiple rules produce a field error, and recurrenceRules holds the stored rules.
  """
  recurrence: ReminderRecurrence

  """
  Whether the reminder is flagged. This is independent of its priority. Read through Reminders automation, which may need Automation permission.
  """
  flagged: Boolean

  """
  The date and time at which to remind the user. Read through Reminders automation, which may need Automation permission.
  """
  remindMeDate: DateTime

  """
  The date and time by which the reminder is due. Unsupported components produce a field error; dueDateComponents holds the stored value.
  """
  dueDate: DateTime

  """
  The date and time at which work on the reminder starts. Unsupported components produce a field error; startDateComponents holds the stored value.
  """
  startDate: DateTime

  """
  The calendar date on which the reminder is due, without a time of day.
  """
  allDayDueDate: LocalDate

  """
  A date-only start, without a time of day.
  """
  allDayStartDate: LocalDate

  """
  IANA time-zone identifier, or null for floating/local date interpretation. Different start and due zones produce a field error.
  """
  timeZone: String

  """
  The list or parent reminder containing this reminder. Read through Reminders automation, which may need Automation permission.
  """
  container: ReminderContainer

  """
  The owning list.
  """
  list: ReminderList
}

"""
Absolute URL serialized as a string.
"""
scalar URL

"""
Stored calendar components; null fields are unset. An hour marks a timed date, and a null timeZone means floating.
"""
type DateComponents {
  era: Int
  year: Int
  month: Int
  day: Int
  hour: Int
  minute: Int
  second: Int
  nanosecond: Int
  weekday: Int
  weekdayOrdinal: Int
  quarter: Int
  weekOfMonth: Int
  weekOfYear: Int
  yearForWeekOfYear: Int
  calendar: String
  timeZone: String
  isLeapMonth: Boolean
}

"""
An alarm exactly as stored.
"""
type RawAlarm {
  """
  Absolute trigger time, when set.
  """
  absoluteDate: DateTime

  """
  Seconds from the start date. Zero alone does not distinguish absolute and relative triggers.
  """
  relativeOffset: Float!

  """
  none, enter, leave, or unknown.
  """
  proximity: String!

  """
  The location of a geofence trigger, when set.
  """
  structuredLocation: StructuredLocation
}

type StructuredLocation {
  """
  Display name of the location.
  """
  title: String

  """
  Latitude in degrees, when set.
  """
  latitude: Float

  """
  Longitude in degrees, when set.
  """
  longitude: Float

  """
  Radius in meters; zero means the system default.
  """
  radius: Float!
}

union ReminderAlarm = AbsoluteAlarm | RelativeAlarm | LocationAlarm

type AbsoluteAlarm {
  """
  The date and time at which the alert triggers.
  """
  at: DateTime!
}

type RelativeAlarm {
  """
  Seconds from the start date: negative before, zero at, positive after.
  """
  offsetSeconds: Float!
}

type LocationAlarm {
  """
  Region and direction that trigger the alert.
  """
  geofence: Geofence!
}

type Geofence {
  """
  Optional display name of the location.
  """
  title: String

  """
  Latitude in degrees, between -90 and 90.
  """
  latitude: Float!

  """
  Longitude in degrees, between -180 and 180.
  """
  longitude: Float!

  """
  Radius in meters. Zero requests the system default; positive values request a minimum radius.
  """
  radiusMeters: Float!

  """
  Whether entering or leaving the region triggers the alert.
  """
  proximity: GeofenceProximity!
}

enum GeofenceProximity {
  """
  Trigger when entering the region.
  """
  ARRIVE

  """
  Trigger when leaving the region.
  """
  DEPART
}

"""
A recurrence rule exactly as stored.
"""
type RecurrenceRule {
  """
  daily, weekly, monthly, yearly, or unknown.
  """
  frequency: String!

  """
  Calendar the rule is evaluated in.
  """
  calendarIdentifier: String!

  """
  Frequency units between occurrences.
  """
  interval: Int!

  """
  First day of the week, Sunday = 1; zero is unset.
  """
  firstDayOfTheWeek: Int!

  """
  Weekday constraints; empty when unconstrained.
  """
  daysOfTheWeek: [RecurrenceDay!]!

  """
  When repetition stops; null for no end.
  """
  end: RecurrenceEnd

  """
  Selector values; empty when unconstrained.
  """
  daysOfTheMonth: [Int!]!

  """
  Selector values; empty when unconstrained.
  """
  daysOfTheYear: [Int!]!

  """
  Selector values; empty when unconstrained.
  """
  weeksOfTheYear: [Int!]!

  """
  Selector values; empty when unconstrained.
  """
  monthsOfTheYear: [Int!]!

  """
  Selector values; empty when unconstrained.
  """
  setPositions: [Int!]!
}

type RecurrenceDay {
  """
  Weekday, Sunday = 1.
  """
  dayOfTheWeek: Int!

  """
  Signed ordinal; zero means every occurrence.
  """
  weekNumber: Int!
}

type RecurrenceEnd {
  """
  End timestamp, when set.
  """
  endDate: DateTime

  """
  Number of occurrences; zero when unset.
  """
  occurrenceCount: Int!
}

type ReminderRecurrence {
  """
  The unit of repetition.
  """
  frequency: RecurrenceFrequency!

  """
  Positive number of frequency units between occurrences.
  """
  interval: Int!

  """
  Weekday constraints. Null means unconstrained. Not allowed for daily rules.
  """
  daysOfWeek: [ReminderRecurrenceDay!]

  """
  When repetition stops; null means no specified end.
  """
  end: ReminderRecurrenceEnd

  """
  Days 1..31 or -31..-1 counting backward from the end of the month. Monthly rules only.
  """
  daysOfMonth: [Int!]

  """
  Months 1..12. Yearly rules only.
  """
  monthsOfYear: [Int!]

  """
  Week numbers 1..53 or -53..-1 counting backward from year end. Yearly rules only.
  """
  weeksOfYear: [Int!]

  """
  Year days 1..366 or -366..-1 counting backward from year end. Yearly rules only.
  """
  daysOfYear: [Int!]

  """
  Select positions 1..366 or -366..-1 from occurrences matching the other constraints in each period. Requires another selector.
  """
  setPositions: [Int!]
}

enum RecurrenceFrequency {
  """
  Repeat in day intervals.
  """
  DAILY

  """
  Repeat in week intervals.
  """
  WEEKLY

  """
  Repeat in month intervals.
  """
  MONTHLY

  """
  Repeat in year intervals.
  """
  YEARLY
}

type ReminderRecurrenceDay {
  """
  The weekday to match.
  """
  day: Weekday!

  """
  Occurrence of this weekday: 1 is first, -1 last; omit for every occurrence. Valid range -53..53 excluding zero; non-null ordinals require monthly or yearly frequency.
  """
  ordinal: Int
}

enum Weekday {
  """
  Sunday.
  """
  SUNDAY

  """
  Monday.
  """
  MONDAY

  """
  Tuesday.
  """
  TUESDAY

  """
  Wednesday.
  """
  WEDNESDAY

  """
  Thursday.
  """
  THURSDAY

  """
  Friday.
  """
  FRIDAY

  """
  Saturday.
  """
  SATURDAY
}

type ReminderRecurrenceEnd {
  """
  Inclusive end timestamp; mutually exclusive with count.
  """
  until: DateTime

  """
  Positive number of occurrences; mutually exclusive with until.
  """
  count: Int
}

"""
Calendar date in YYYY-MM-DD form, without a time or offset.
"""
scalar LocalDate

union ReminderContainer = ReminderList | Reminder

type PageInfo {
  """
  Requested zero-based offset.
  """
  offset: Int!

  """
  Requested maximum page size.
  """
  limit: Int!

  """
  Whether results exist after this page.
  """
  hasNextPage: Boolean!

  """
  Whether matching results exist before the requested offset.
  """
  hasPreviousPage: Boolean!
}

type ListSummary {
  """
  All reminders in the list, including completed ones.
  """
  total: Int!

  """
  Completed reminders.
  """
  completed: Int!

  """
  Incomplete reminders.
  """
  incomplete: Int!

  """
  Incomplete reminders whose deadline has passed.
  """
  overdue: Int!

  """
  Reminders with a due date, including completed ones.
  """
  scheduled: Int!

  """
  Reminders with recurrence rules, including completed ones.
  """
  recurring: Int!

  """
  Reminders with alarms, including completed ones.
  """
  withAlarms: Int!
}

type Mutation {
  """
  Create a list. If a step after the save fails, the error has code WRITE_APPLIED and names the saved ID; do not retry creation blindly. Select id to retain it if response metadata fails.
  """
  createList(input: CreateListInput!): ReminderList

  """
  Update list properties. An error with code WRITE_APPLIED means the save succeeded before a later failure; refetch the saved ID before retrying.
  """
  updateList(id: ID!, patch: ListPatch!): ReminderList

  """
  Delete a list; nonempty lists require allowNonEmpty. Concurrent external edits are not locked.
  """
  deleteList(id: ID!, allowNonEmpty: Boolean! = false): DeleteResult

  """
  Show a reminder in the Reminders UI without changing its data.
  """
  showReminder(id: ID!): Reminder

  """
  Show a list in the Reminders UI without changing its data.
  """
  showList(id: ID!): ReminderList

  """
  Create an incomplete reminder in an editable list. Omitted listId uses the application default. If a step after the save fails, the error has code WRITE_APPLIED and names the saved ID; do not retry creation blindly. Select id to retain it if response metadata fails.
  """
  createReminder(input: CreateReminderInput!): Reminder

  """
  Update supplied fields. Null patch values are rejected; clearFields removes optional values. Dates can affect alerts. An error with code WRITE_APPLIED means the save succeeded before a later failure; refetch the saved ID before retrying.
  """
  updateReminder(id: ID!, patch: ReminderPatch!): Reminder

  """
  Delete completed reminders in one list. Keep incomplete reminders and the list.
  """
  clearCompletedReminders(listId: ID!): ClearCompletedResult

  """
  Delete a reminder in an editable list. Missing identifiers return a NOT_FOUND error.
  """
  deleteReminder(id: ID!): DeleteResult
}

input CreateListInput {
  """
  Name of the new list.
  """
  name: String!

  """
  Opaque sRGB list color: #RRGGBB or #RRGGBBFF.
  """
  color: String

  """
  Emblem icon name.
  """
  emblem: String

  """
  Account in which to create the list.
  """
  accountId: ID!
}

input ListPatch {
  """
  The new name of the list.
  """
  name: String

  """
  The new opaque sRGB list color: #RRGGBB or #RRGGBBFF.
  """
  color: String

  """
  The new emblem icon name for the list.
  """
  emblem: String
}

type DeleteResult {
  """
  The deleted object's identifier.
  """
  deletedId: ID!
}

input CreateReminderInput {
  """
  Name of the new reminder.
  """
  name: String!

  """
  Notes to attach to the reminder.
  """
  body: String

  """
  Priority from 0 through 9.
  """
  priority: Int

  """
  Unsupported: Reminders does not keep free-text locations, so writes are rejected. Use a geofence alarm.
  """
  location: String

  """
  An associated absolute URL; does not promise a rich-link preview in Reminders.
  """
  url: String

  """
  A deadline including a time of day.
  """
  dueDate: DateTime

  """
  A date-only deadline; mutually exclusive with dueDate.
  """
  allDayDueDate: LocalDate

  """
  The date and time at which work on the reminder starts. It cannot be later than the due date.
  """
  startDate: DateTime

  """
  Unsupported: date-only start writes are rejected because storage does not preserve them. Use startDate.
  """
  allDayStartDate: LocalDate

  """
  IANA time-zone identifier for the start and due dates, which requires at least one of them; omission stores timed dates in UTC.
  """
  timeZone: String

  """
  Whether to flag the new reminder.
  """
  flagged: Boolean

  """
  Date and time at which to remind the user; cannot be combined with alarms, start, due, or timeZone.
  """
  remindMeDate: DateTime

  """
  Alerts to configure; omission or an empty list configures no explicit alerts.
  """
  alarms: [ReminderAlarmInput!]

  """
  Repeating schedule; omission creates a non-repeating reminder.
  """
  recurrence: RecurrenceRuleInput

  """
  Destination list; omission uses the default list. No default produces an error.
  """
  listId: ID
}

input ReminderAlarmInput {
  """
  Trigger at this instant.
  """
  absoluteDate: DateTime

  """
  Seconds from the reminder's start date; negative means before. Requires a resulting start date.
  """
  relativeOffsetSeconds: Float

  """
  Trigger on arrival at or departure from this region.
  """
  geofence: GeofenceInput
}

input GeofenceInput {
  """
  Optional display name of the location.
  """
  title: String

  """
  Latitude in degrees, between -90 and 90.
  """
  latitude: Float!

  """
  Longitude in degrees, between -180 and 180.
  """
  longitude: Float!

  """
  Radius in meters. Zero requests the system default; positive values request a minimum radius.
  """
  radiusMeters: Float!

  """
  Whether entering or leaving the region triggers the alert.
  """
  proximity: GeofenceProximity!
}

input RecurrenceRuleInput {
  """
  The unit of repetition.
  """
  frequency: RecurrenceFrequency!

  """
  Positive number of frequency units between occurrences.
  """
  interval: Int!

  """
  Weekday constraints. Null means unconstrained. Not allowed for daily rules.
  """
  daysOfWeek: [RecurrenceDayInput!]

  """
  When repetition stops; null means no specified end.
  """
  end: RecurrenceEndInput

  """
  Days 1..31 or -31..-1 counting backward from the end of the month. Monthly rules only.
  """
  daysOfMonth: [Int!]

  """
  Months 1..12. Yearly rules only.
  """
  monthsOfYear: [Int!]

  """
  Week numbers 1..53 or -53..-1 counting backward from year end. Yearly rules only.
  """
  weeksOfYear: [Int!]

  """
  Year days 1..366 or -366..-1 counting backward from year end. Yearly rules only.
  """
  daysOfYear: [Int!]

  """
  Select positions 1..366 or -366..-1 from occurrences matching the other constraints in each period. Requires another selector.
  """
  setPositions: [Int!]
}

input RecurrenceDayInput {
  """
  The weekday to match.
  """
  day: Weekday!

  """
  Occurrence of this weekday: 1 is first, -1 last; omit for every occurrence. Valid range -53..53 excluding zero; non-null ordinals require monthly or yearly frequency.
  """
  ordinal: Int
}

input RecurrenceEndInput {
  """
  Inclusive end timestamp; mutually exclusive with count.
  """
  until: DateTime

  """
  Positive number of occurrences; mutually exclusive with until.
  """
  count: Int
}

input ReminderPatch {
  """
  The new name of the reminder.
  """
  name: String

  """
  The new notes attached to the reminder. An empty string removes the notes.
  """
  body: String

  """
  Set the priority: 0 none, 1–4 high, 5 medium, or 6–9 low.
  """
  priority: Int

  """
  Unsupported: Reminders does not keep free-text locations, so writes are rejected. Use a geofence alarm.
  """
  location: String

  """
  An associated absolute URL; does not promise a rich-link preview in Reminders.
  """
  url: String

  """
  Set the due date and time. Cannot be combined with allDayDueDate.
  """
  dueDate: DateTime

  """
  Set a date-only deadline. Cannot be combined with dueDate.
  """
  allDayDueDate: LocalDate

  """
  The date and time at which work on the reminder starts. It cannot be later than the due date.
  """
  startDate: DateTime

  """
  Unsupported: date-only start writes are rejected because storage does not preserve them. Use startDate.
  """
  allDayStartDate: LocalDate

  """
  Set an IANA time-zone identifier; requires a resulting start or due date. Use clearFields for floating/local interpretation.
  """
  timeZone: String

  """
  Set whether the reminder is flagged, independently of priority.
  """
  flagged: Boolean

  """
  Set the date and time at which to remind the user. Cannot be combined with date, time-zone, or alarm changes, or cleared.
  """
  remindMeDate: DateTime

  """
  Replace all configured alerts. An empty list removes all alerts.
  """
  alarms: [ReminderAlarmInput!]

  """
  Replace the repeating schedule. Use clearFields to stop repetition.
  """
  recurrence: RecurrenceRuleInput

  """
  Set the date and time the reminder was completed, which marks it completed. Cannot be combined with completed.
  """
  completionDate: DateTime

  """
  Whether to mark the reminder completed. Cannot be combined with completionDate changes.
  """
  completed: Boolean

  """
  Remove these values. Omission preserves them; explicit null is rejected. Do not set and clear the same field, or clear both forms of one date.
  """
  clearFields: [ReminderClearField!] = []
}

enum ReminderClearField {
  """
  Unsupported: Reminders does not keep free-text locations.
  """
  LOCATION

  """
  Remove the associated URL.
  """
  URL

  """
  Remove the timed due date.
  """
  DUE_DATE

  """
  Remove the all-day due date.
  """
  ALL_DAY_DUE_DATE

  """
  Remove the completion date.
  """
  COMPLETION_DATE

  """
  Stop repetition.
  """
  RECURRENCE

  """
  Use floating/local time-zone interpretation.
  """
  TIME_ZONE

  """
  Remove the timed start date.
  """
  START_DATE

  """
  Remove the all-day start date.
  """
  ALL_DAY_START_DATE
}

type ClearCompletedResult {
  """
  The list whose completed reminders were deleted.
  """
  listId: ID!

  """
  Number of completed reminders deleted.
  """
  deletedCount: Int!
}
