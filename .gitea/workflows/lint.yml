name: Lint

on: [push]

jobs:
  swift-format:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Swift
        uses: docker://swift:6.4-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
        with:
          entrypoint: swift
          args: format lint --strict --recursive Sources Package.swift

  package-resolved:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Package.resolved
        uses: docker://swift:6.4-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
        with:
          entrypoint: swift
          args: package --force-resolved-versions resolve

      - name: Check for lockfile changes
        run: git diff --exit-code -- Package.resolved
