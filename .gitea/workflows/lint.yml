name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  resolved:
    runs-on: ubuntu-amd64

    container:
      image: swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Package.resolved
        run: |
          swift package --force-resolved-versions resolve
          git diff --exit-code -- Package.resolved
