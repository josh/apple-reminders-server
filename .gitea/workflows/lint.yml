name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-resolved:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Package.resolved
        uses: docker://swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
        with:
          entrypoint: swift
          args: package --force-resolved-versions resolve

      - name: Check for lockfile changes
        run: git diff --exit-code -- Package.resolved
