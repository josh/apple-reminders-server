name: Lint

on: [push]

jobs:
  swift-format:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Swift
        uses: docker://swift:6.4-noble@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7
        with:
          entrypoint: swift
          args: format lint --strict --recursive Sources Package.swift

  package-resolved:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Package.resolved
        uses: docker://swift:6.4-noble@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7
        with:
          entrypoint: swift
          args: package --force-resolved-versions resolve

      - name: Check for lockfile changes
        run: git diff --exit-code -- Package.resolved
